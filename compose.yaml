services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feverplans
      POSTGRES_USER: fever
      POSTGRES_PASSWORD: fever
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fever -d feverplans"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/feverplans
      DB_USERNAME: fever
      DB_PASSWORD: fever
    ports:
      - "8080:8080"

volumes:
  postgres-data:
